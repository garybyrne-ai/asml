<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Locksmiths.ie - PSA Licensed Dublin Locksmith">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"  stop-color="#1c4396"/>
      <stop offset=".55" stop-color="#0e1f4a"/>
      <stop offset="1"  stop-color="#0a1738"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb547"/>
      <stop offset="1" stop-color="#ff7b1a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#f3f6fb"/>
      <stop offset=".5"  stop-color="#bfc7d4"/>
      <stop offset="1"   stop-color="#7c8696"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#163680"/>
      <stop offset="1" stop-color="#0e1f4a"/>
    </linearGradient>
    <radialGradient id="spark" cx=".5" cy=".5" r=".5">
      <stop offset="0"  stop-color="#fff"   stop-opacity=".9"/>
      <stop offset=".4" stop-color="#ffd166" stop-opacity=".6"/>
      <stop offset="1"  stop-color="#ffb300" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Crossed silver keys (behind shield) -->
  <g transform="translate(300 290)">
    <g transform="rotate(-25)">
      <circle cx="-160" cy="0" r="32" fill="url(#metal)" stroke="#3a4252" stroke-width="3"/>
      <circle cx="-160" cy="0" r="14" fill="#0e1f4a"/>
      <rect x="-128" y="-9" width="240" height="18" fill="url(#metal)" stroke="#3a4252" stroke-width="2"/>
      <rect x="86"  y="9"  width="14" height="14" fill="url(#metal)" stroke="#3a4252" stroke-width="2"/>
      <rect x="106" y="9"  width="10" height="18" fill="url(#metal)" stroke="#3a4252" stroke-width="2"/>
    </g>
    <g transform="rotate(25)">
      <circle cx="160" cy="0" r="32" fill="url(#metal)" stroke="#3a4252" stroke-width="3"/>
      <circle cx="160" cy="0" r="14" fill="#0e1f4a"/>
      <rect x="-112" y="-9" width="240" height="18" fill="url(#metal)" stroke="#3a4252" stroke-width="2"/>
      <rect x="-100" y="9"  width="14" height="14" fill="url(#metal)" stroke="#3a4252" stroke-width="2"/>
      <rect x="-116" y="9"  width="10" height="18" fill="url(#metal)" stroke="#3a4252" stroke-width="2"/>
    </g>
  </g>

  <!-- Shield -->
  <g transform="translate(300 290)">
    <!-- orange outline -->
    <path d="M-150 -150 H150 V20 C150 110 80 170 0 200 C-80 170 -150 110 -150 20 Z"
          fill="url(#orange)"/>
    <!-- inner navy face -->
    <path d="M-138 -138 H138 V18 C138 100 75 156 0 184 C-75 156 -138 100 -138 18 Z"
          fill="url(#shield)"/>
    <!-- subtle highlight -->
    <path d="M-138 -138 H138 V18 C138 100 75 156 0 184 C-75 156 -138 100 -138 18 Z"
          fill="none" stroke="#3960c4" stroke-opacity=".35" stroke-width="3"/>

    <!-- Keyhole -->
    <g fill="#fff">
      <circle cx="0" cy="-30" r="26"/>
      <path d="M-12 -30 L-18 70 H18 L12 -30 Z"/>
    </g>

    <!-- Spark / flare top right -->
    <circle cx="120" cy="-128" r="60" fill="url(#spark)"/>
    <g stroke="#ffd166" stroke-width="3" stroke-linecap="round" opacity=".85">
      <line x1="120" y1="-160" x2="120" y2="-100"/>
      <line x1="92"  y1="-128" x2="148" y2="-128"/>
      <line x1="100" y1="-148" x2="140" y2="-108"/>
      <line x1="100" y1="-108" x2="140" y2="-148"/>
    </g>
  </g>

  <!-- Shamrock -->
  <g transform="translate(168 320)" fill="#169b3d" stroke="#0c6928" stroke-width="2">
    <circle cx="0"   cy="-12" r="14"/>
    <circle cx="-13" cy="6"   r="14"/>
    <circle cx="13"  cy="6"   r="14"/>
    <circle cx="0"   cy="14"  r="11"/>
    <path d="M0 18 L-2 38 L2 38 Z" fill="#0c6928" stroke="none"/>
  </g>

  <!-- LOCKSMITHS.ie banner -->
  <g transform="translate(300 425)">
    <path d="M-240 0 Q-200 -30 -160 -16 L160 -16 Q200 -30 240 0 L228 38 Q200 24 160 32 L-160 32 Q-200 24 -228 38 Z"
          fill="url(#ribbon)" stroke="url(#orange)" stroke-width="6"/>
    <text x="0" y="20" text-anchor="middle"
          font-family="Outfit, 'Trebuchet MS', sans-serif" font-weight="900" font-size="68"
          fill="url(#orange)" stroke="#fff" stroke-width="2" paint-order="stroke">LOCKSMITHS<tspan fill="#fff" stroke="none">.ie</tspan></text>
  </g>

  <!-- Tricolour ribbon tails -->
  <g transform="translate(300 470)">
    <!-- left tail -->
    <path d="M-220 0 L-120 30 L-120 60 L-244 30 Z" fill="#169b3d"/>
    <path d="M-180 14 L-120 32 L-120 48 L-180 30 Z" fill="#fff"/>
    <path d="M-150 22 L-120 33 L-120 47 L-150 36 Z" fill="#ff883e"/>
    <!-- right tail -->
    <path d="M220 0 L120 30 L120 60 L244 30 Z" fill="#ff883e"/>
    <path d="M180 14 L120 32 L120 48 L180 30 Z" fill="#fff"/>
    <path d="M150 22 L120 33 L120 47 L150 36 Z" fill="#169b3d"/>
  </g>
</svg>
